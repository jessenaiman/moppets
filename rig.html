<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHIMERA rig playground</title>
<style>
  @font-face { font-family: Hershey; src: url("/fonts/AVHersheySimplexMedium.otf") format("opentype"); font-weight: 500; font-display: swap; }
  html, body { margin: 0; height: 100%; background: #000; color: #4fb6f2; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #words { pointer-events: none; }
  .panel { position: fixed; box-sizing: border-box; background: rgb(0 0 0 / 75%); padding: 8px 10px; border: 1px solid #133954; border-radius: 6px; overflow: auto; }
  #stage { left: 12px; bottom: 12px; max-width: min(840px, calc(100vw - 246px)); max-height: 40dvh; display: flex; flex-direction: column; }
  #stage-options { overflow: auto; }
  #chat { flex: none; margin-top: 6px; }
  #line { display: block; width: 100%; box-sizing: border-box; padding: 3px 5px; }
  #joints { right: 12px; top: 12px; width: 210px; max-height: calc(100dvh - 24px); }
  .row, #cast, #pulses { display: flex; flex-wrap: wrap; gap: 5px 8px; align-items: center; }
  .row + .row { margin-top: 6px; }
  #cast-tools { display: flex; align-items: center; gap: 5px; padding-right: 32px; }
  label { display: inline-flex; gap: 4px; align-items: center; }
  select, input, button, .file-button { accent-color: #4fb6f2; background: #000; color: inherit; border: 1px solid #1f5f8c; border-radius: 4px; font: inherit; }
  button, summary, .file-button { cursor: pointer; }
  button[aria-pressed="true"] { color: #000; background: #4fb6f2; }
  button:disabled { cursor: default; border-color: #133954; }
  input[type=number] { width: 5ch; }
  input[type=range] { width: 68px; margin: 0; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .file-button { padding: 1px 6px; }
  .file-button:focus-within { outline: auto; }
  #clip { max-width: min(42vw, 180px); }
  #motion-name { max-width: min(42vw, 140px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #notice:empty { display: none; }
  details { margin-top: 6px; }
  .joint { display: grid; grid-template-columns: 1fr 68px 6ch; gap: 4px; padding: 2px 0; }
  .joint output { text-align: right; font-variant-numeric: tabular-nums; }
  [hidden], body.shot .panel { display: none !important; }
  body.shot.chat-open #stage { display: block !important; width: min(420px, calc(100vw - 24px)); }
  body.shot.chat-open #stage-options { display: none; }
  body.shot.chat-open #chat { margin: 0; }
  @media (max-width: 600px) {
    #stage { left: 6px; right: 6px; bottom: 6px; max-width: none; max-height: 34dvh; }
    #joints { right: 6px; top: 6px; max-height: 38dvh; }
  }
</style>
</head>
<body>
<canvas aria-label="Chimera stage"></canvas>
<canvas id="words" aria-hidden="true"></canvas>
<section id="stage" class="panel" aria-label="Stage controls" inert>
  <div id="stage-options">
    <div class="row">
      <div id="cast" aria-label="Chimeras"></div>
      <div id="cast-tools">
        <button id="add" aria-label="Add chimera">+</button>
        <button id="remove" aria-label="Remove selected chimera">×</button>
      </div>
    </div>
    <div class="row">
      <label>voice <select id="voice"></select></label>
      <label>pitch <input id="pitch" type="number" min="60" max="500" step="1"> Hz</label>
      <label>size <input id="size" type="range" min="0.5" max="1.3" step="0.01"><output id="size-value"></output></label>
      <label>look <select id="look"></select></label>
      <label>preset <select id="preset"></select></label>
      <label>mouth <input id="mouth" type="range" min="0" max="1" step="0.01"></label>
    </div>
    <div class="row">
      <label class="file-button">motion file <input id="motion" type="file" accept=".fbx,.bvh,.glb,.gltf"></label>
      <span id="motion-name" hidden></span>
      <select id="clip" aria-label="Motion clip" hidden></select>
      <button id="copy">copy pose</button>
      <button id="clear">clear stage</button>
      <output id="notice" role="status"></output>
    </div>
    <div class="row" aria-label="Camera views">
      <button data-view="body">body</button><button data-view="front">front</button><button data-view="back">back</button>
      <button data-view="torso">torso</button><button data-view="head">head</button><button data-view="face">face</button><button data-view="side">side</button>
      <div id="pulses" hidden>
        <label>signal <input id="signal" type="range" min="0" max="1" step="0.01"></label>
        <label>speed <input id="speed" type="range" min="0" max="60" step="1"></label>
      </div>
    </div>
  </div>
  <form id="chat">
    <input id="line" type="text" aria-label="Say something" placeholder="say something…">
  </form>
</section>
<aside id="joints" class="panel" aria-label="Pose joints" inert>
  <div class="row">
    <label><input id="mirror" type="checkbox"> mirror</label>
    <button id="neutral">neutral</button>
  </div>
</aside>
<script>if (new URLSearchParams(location.search).has("shot")) document.body.classList.add("shot");</script>
<script type="module" src="/src/chimera/rig/playground.ts"></script>
</body>
</html>
