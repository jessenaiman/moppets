[package]
name = "moppet-wasm"
description = "The Moppets' wasm: CHIMERA's whole C ABI, plus Moppet voices whose airway is any size"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chimera = { path = "../chimera" }
# linked whole: its C ABI (planning, the beatbox, creatures, the JSON calls) is exported unchanged
chimera-wasm = { path = "../chimera-wasm" }
