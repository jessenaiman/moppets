<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#171916">
    <title>Left in the Workshop · Audition</title>
  </head>
  <body>
    <main class="mx-auto grid w-full max-w-xl gap-5 px-4 py-8 sm:px-6 sm:py-12">
      <header>
        <p class="eyebrow">First chorus audition</p>
        <h1>Left in the Workshop</h1>
      </header>

      <section class="panel overflow-hidden" aria-label="Playback">
        <div class="portraits grid grid-cols-2" id="portraits" aria-hidden="true">
          <img class="portrait" data-part="gruff" src="./gruff.webp" alt="" width="1536" height="1024">
          <img class="portrait" data-part="vee" src="./vee.webp" alt="" width="1536" height="1024">
        </div>
        <div class="grid grid-cols-3 gap-2 px-3 pb-3 sm:px-5 sm:pb-5" aria-label="Audition parts" role="group">
          <button type="button" data-mode="gruff" aria-pressed="true">Gruff solo</button>
          <button type="button" data-mode="vee" aria-pressed="false">Vee solo</button>
          <button type="button" data-mode="ensemble" aria-pressed="false">Ensemble</button>
        </div>
        <div class="cue grid content-center gap-2 px-4 py-5 sm:px-6">
          <p class="eyebrow" id="bar">Bar 1</p>
          <p id="lyric"></p>
        </div>
        <div class="grid grid-cols-2 gap-2 px-3 py-3 sm:px-5 sm:py-4">
          <button type="button" id="replay">Replay</button>
          <button type="button" id="stop" disabled>Stop</button>
          <p id="status" role="status" class="col-span-2"></p>
        </div>
      </section>

      <form id="edits" class="panel grid gap-4 p-4 sm:p-6" aria-labelledby="edits-title">
        <div>
          <h2 id="edits-title">Part adjustments</h2>
          <p class="muted">Changes apply the next time you play.</p>
        </div>
        <div class="grid gap-3 sm:grid-cols-3">
          <label>Part
            <select id="part"></select>
          </label>
          <label>Pitch (semitones)
            <input id="pitch" type="number" step="1" value="0">
          </label>
          <label>Entrance (beats)
            <input id="entrance" type="number" step="any" value="0" aria-describedby="entrance-hint">
          </label>
        </div>
        <p class="muted" id="entrance-hint">Use a negative entrance to start a part earlier.</p>
      </form>

      <details id="conflicts" class="panel p-4 sm:p-6" hidden>
        <summary>Part conflicts for review</summary>
        <ul id="conflict-list" class="mt-3 list-disc space-y-2 pl-5"></ul>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
